name: deploy check

# Production build gate for the deployable CAP app this repo owns.
#
# What this gate covers — and why it is shaped this way:
# - `npm run build:production` is the real check -- `cds build --production`
#   plus scripts/vendor-core.js, the pair mta.yaml's before-all runs. It
#   compiles the full CDS model + service (db + srv, including the imported
#   Northwind model) exactly as a BTP deployment would, so a broken model,
#   broken service wiring or a broken production build is caught on every PR
#   and push to main instead of at deploy time. (Two harmless Edm.Double key
#   warnings from the imported Northwind model are expected.)
# - The build outputs both deployed modules declare in mta.yaml — the server
#   module (gen/srv) and the HDI database artifacts (gen/db) — are then
#   asserted to exist, guarding against `cds build` exiting 0 without
#   actually producing them. Existence is not enough on its own: the staged
#   server module is also installed in isolation (`npm ci --omit=dev`, what
#   the buildpack runs) and required, because a gen/srv that exists but
#   cannot resolve its own dependencies is exactly the failure this gate
#   missed until 2026-08. gen/db matters because the z2ui5 runtime writes
#   a draft row on every roundtrip: a deployment whose database module is
#   missing compiles fine and then fails on the first user interaction.
#
# Why NOT a full `npx mbt build` of the MTA archive:
#   The whole app under app/z2ui5 (and mta.yaml itself) is a generated
#   artifact — everything outside .github/ is wiped and rewritten on every
#   publish, so it cannot be fixed here; its source lives in
#   builder-cap2UI5:src/. A full `mbt build` also builds the html5 module
#   `abap2UI5` (path app/z2ui5) via `npm install && npm run build:cf`, so
#   gating it here would couple this repo's CI to that generated frontend
#   build. That html5-module deployability is instead gated at its source:
#   builder-cap2UI5 ships app/z2ui5's package.json / ui5.yaml / xs-app.json
#   and its assemble step is covered by the builder's own tests. This
#   workflow gates the CAP production build that maps to this repo's own
#   server module.
#
#   That "gated at its source" claim was aspirational until 2026-08: nothing
#   tested xs-app.json at all, and it turned out to have no route to the
#   abap2UI5-srv destination — its catch-all sent every /rest/root/z2ui5
#   roundtrip to the static HTML5 repository, so the deployed app could not
#   have worked. It is now genuinely covered, by test/approuter-routes.test.js
#   in this repo's own jest suite (run by test.yml): the routing contract,
#   the auth type, and that every destination a route names exists in
#   mta.yaml. Routing regressions are caught here without an mbt build.
#
#   (History: app/z2ui5 previously shipped without that scaffolding, so a
#   full `mbt build` here failed with `Missing script: "build:cf"` — the
#   original reason this gate was narrowed. That gap is now fixed upstream.)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # the app's own declared runtime
          node-version-file: .nvmrc
      # one install covers the app AND the vendored core (its deps are part
      # of the app lock, placed under core/node_modules/)
      - run: npm ci
      # The real gate: the production CAP build, exactly as mta.yaml's
      # before-all runs it. NOT a bare `npx cds build --production` — that is
      # only half of it. `cds build` stages gen/srv with the app's
      # "abap2UI5": "file:./core" dependency and does not copy core/ there;
      # scripts/vendor-core.js does, and also drops the local UI5 runtime
      # (openui5-dist) the deployed server never serves.
      - run: npm run build:production
      # guard against cds build exiting 0 without producing the deployed modules
      - name: verify deployed modules were built
        run: |
          set -euo pipefail
          test -f gen/srv/srv/server.js
          test -f gen/srv/package.json
          # mta.yaml's abap2UI5-db-deployer module deploys this path
          test -d gen/db/src
      # …and that the module CF pushes can actually be installed and loaded.
      #
      # Existence checks alone are what let a broken deployment through for
      # months: gen/srv/package.json declared a dependency on ./core that was
      # not in the build output, `npm ci` created node_modules/abap2UI5 as a
      # symlink to nothing (npm does not check link targets), the archive
      # built, `cf deploy` succeeded, and the instance crash-looped on
      # `Cannot find module 'abap2UI5/engine'` at srv/server.js:3. Installing
      # the staged module in isolation and requiring its entry point is the
      # only assertion that would have caught it.
      - name: staged server module installs and loads
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/gen-srv"
          rm -rf "$STAGE"
          cp -r gen/srv "$STAGE"
          cd "$STAGE"
          # --omit=dev: what the Cloud Foundry nodejs buildpack installs
          npm ci --omit=dev
          node -e "require('./srv/server.js'); console.log('staged server module loaded')"
          # A hard gate, unlike the advisory audit in test.yml, because this
          # is the tree that actually ships and its baseline is clean: 0
          # advisories, 19 MB. It was 43 (3 critical, 27 high) and 611 MB
          # while the staged tree still carried openui5-dist's release
          # tooling — npm@6, request, jsdom — which the deployed server never
          # loads. If this goes red, a dependency of the DEPLOYED app has an
          # advisory; fix it in builder-cap2UI5:src/, not here.
          npm audit --omit=dev --audit-level=high
