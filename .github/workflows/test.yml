name: test

# Runs the CAP app's jest suite on every pull request (and on pushes to
# main — including the publish commits builder-cap2UI5 pushes here).
# Make this check "Required" in the branch protection rules of `main` so a
# PR can only be merged once the tests pass.
#
# Note: this repository is generated by cap2UI5/builder-cap2UI5 — do not
# hand-edit anything outside .github/ here; change builder-cap2UI5:src/
# instead.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # one install covers the app AND the vendored core/ (its deps are
      # part of the app lock, placed under core/node_modules/)
      - run: npm ci
      - run: npm test

  # Vulnerability check on the DEVELOPMENT tree -- what `npm ci` at the repo
  # root installs, which is a superset of what is deployed.
  #
  # The tree that actually ships is audited as a HARD gate in
  # deploy-check.yml, against the staged gen/srv module: 0 advisories, 19 MB.
  # This job sees more than that, because the app root still installs
  # openui5-dist (the local UI5 runtime `cds watch` serves at /resources).
  # That package is deprecated and its own dependencies are its release
  # tooling -- npm@6, request, jsdom, simple-git -- which is where every
  # advisory below comes from, none of it code the app runs, and none of it
  # deployed: scripts/vendor-core.js drops it from the production build.
  #
  # So this stays advisory (`continue-on-error`): it is a standing reminder
  # about a development-only dependency, not a gate on shipping. It goes
  # green for good when the core package stops declaring openui5-dist as a
  # runtime dependency (see builder-abap2UI5-js:src/package.json).
  #
  # (Lint is deliberately NOT here: the app's source is linted where it is
  # written, in builder-cap2UI5's own eslint run over src/srv and src/test.
  # Adding eslint to this generated repo would mean shipping a dev dependency
  # to every consumer to re-check code that was already checked.)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (development tree — advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
