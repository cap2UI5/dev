name: test

# Runs the CAP app's jest suite on every pull request (and on pushes to
# main — including the publish commits builder-cap2UI5 pushes here).
# Make this check "Required" in the branch protection rules of `main` so a
# PR can only be merged once the tests pass.
#
# Note: this repository is generated by cap2UI5/builder-cap2UI5 — do not
# hand-edit anything outside .github/ here; change builder-cap2UI5:src/
# instead.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # one install covers the app AND the vendored core/ (its deps are
      # part of the app lock, placed under core/node_modules/)
      - run: npm ci
      - run: npm test

  # Vulnerability check on the app's production dependency set, at the repo
  # root. Clean as of 2026-08: 0 advisories, where it was 43 (3 critical, 27
  # high) while the framework still declared the UI5 runtime openui5-dist as
  # a runtime dependency -- 611 MB of deprecated release tooling (npm@6,
  # request, jsdom) that the app never loads. It is now a devDependency here
  # and an optional peer dependency of the framework, so `--omit=dev` no
  # longer sees it. `npm ci` at the root still installs it, for the
  # /resources mount `cds watch` serves locally; that development-only tree
  # is deliberately not what this job measures.
  #
  # Advisory (`continue-on-error`) rather than blocking, and not because the
  # baseline is dirty: the hard gate on the same question lives in
  # deploy-check.yml, which audits the STAGED gen/srv module -- the bytes
  # that are actually pushed. This job is the earlier, cheaper signal on the
  # same set. A finding in either is fixed in builder-cap2UI5:src/, not
  # here.
  #
  # (Lint is deliberately NOT here: the app's source is linted where it is
  # written, in builder-cap2UI5's own eslint run over src/srv and src/test.
  # Adding eslint to this generated repo would mean shipping a dev dependency
  # to every consumer to re-check code that was already checked.)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (production dependencies — advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
